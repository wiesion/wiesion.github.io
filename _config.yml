# Site settings
title: "Software-Entwicklung Ostschweiz & Zürich"
description: "Erfahrener Freelance-Entwickler: Web-Anwendungen, Datenbank-Optimierung, Full-Stack-Entwicklung. Für KMU und Entwicklungsteams. 20+ Jahre Expertise."
author: "Thomas Wieser"
email: "thomas@wiesion.ch"
baseurl: ""
url: "https://wiesion.ch"
lang: de
ignore_theme_config: true
logo: "/assets/img/icon.png"

# Build settings
markdown: kramdown
highlighter: rouge

# Rouge configuration
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false  # Set to true if you want line numbers by default
    block:
      line_numbers: false  # Can be overridden per block
      start_line: 1

# Plugins (GitHub Pages compatible only)
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Exclude from processing
exclude:
  - .idea/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docker-compose.yml
  - Dockerfile
  - README.md
  - dev.bat
  - dev.sh
